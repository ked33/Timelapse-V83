name: Build Timelapse v83

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-x86:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # The trainer targets the 32-bit v83 client and uses x86 inline assembly.
      - name: Build Debug x86
        shell: pwsh
        run: |
          $buildDir = Join-Path $env:GITHUB_WORKSPACE 'build-output'
          $intermediateDir = Join-Path $env:GITHUB_WORKSPACE 'obj'
          New-Item -ItemType Directory -Path $buildDir -Force | Out-Null
          New-Item -ItemType Directory -Path $intermediateDir -Force | Out-Null

          $msbuildArgs = @(
            (Join-Path $env:GITHUB_WORKSPACE 'Timelapse.sln'),
            '/t:Build',
            '/m',
            '/verbosity:minimal',
            '/p:Configuration=Debug',
            '/p:Platform=x86',
            ('/p:OutDir=' + $buildDir + '\'),
            ('/p:IntDir=' + $intermediateDir + '\')
          )
          & msbuild @msbuildArgs
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Stage DLL only
        shell: pwsh
        run: |
          $buildDll = Join-Path $env:GITHUB_WORKSPACE 'build-output\Timelapse-v83.dll'
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          if (-not (Test-Path -LiteralPath $buildDll)) {
            throw "The x86 build did not produce $buildDll"
          }
          if (Test-Path -LiteralPath $artifactDir) {
            Remove-Item -LiteralPath $artifactDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null
          Copy-Item -LiteralPath $buildDll -Destination (Join-Path $artifactDir 'Timelapse-v83.dll')

          $files = @(Get-ChildItem -LiteralPath $artifactDir -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'Timelapse-v83.dll') {
            throw "Unexpected artifact contents: $($files.Name -join ', ')"
          }
          $files | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload x86 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Timelapse-v83-Debug-x86
          path: artifacts/Timelapse-v83.dll
          if-no-files-found: error
